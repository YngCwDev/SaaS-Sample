<!DOCTYPE html>
<html lang="pt">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mensagem Romântica</title>
</head>
<body style="margin: 0; padding: 0; font-family: 'Arial', sans-serif; background-color: #ffe6f2; color: #333; text-align: center;">
    <div style="padding: 20px;">
        <h1 style="font-size: 2.5em; color: #ff66b2; margin: 0; text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.1);">
            Hello, my princess Ancha
        </h1>
        <h2 style="font-size: 1.5em; color: #ff99cc; margin: 20px 0 0;">
            Sorry, não posso falar agora, vamos conversar amanhã, tá bom?
        </h2>
        <h2 style="font-size: 1.5em; color: #ff99cc; margin-top: 10px;">
            Bom descanso, my princess, Love U ❤️
        </h2>
        <div style="margin-top: 30px;">
            <svg viewBox="0 0 100 100" width="100" height="100">
                <circle cx="50" cy="50" r="50" fill="pink" />
                <text x="50%" y="50%" text-anchor="middle" dy=".3em" font-size="2.5em" fill="white">❤️</text>
            </svg>
        </div>
    </div>


    {% block content %}

    {% endblock content %}
</html>
